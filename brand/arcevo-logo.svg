<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <linearGradient id="arc-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="arc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="arc-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="arc-shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0d9488" flood-opacity="0.35"/>
    </filter>
    <filter id="gold-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Icon background -->
  <rect x="8" y="8" width="124" height="124" rx="30" fill="url(#arc-icon)" filter="url(#arc-shadow)"/>

  <!-- Arc path: career journey from bottom-left to top-right -->
  <!-- Background arc (dimmer) -->
  <path d="M 24 104 Q 70 24 116 28" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.25"/>
  <!-- Main arc -->
  <path d="M 24 104 Q 70 30 112 34" stroke="white" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Nodes on the arc: start, mid, end -->
  <!-- Start node -->
  <circle cx="24" cy="104" r="6" fill="white" opacity="0.6"/>
  <!-- Mid node -->
  <circle cx="68" cy="52" r="6" fill="white" opacity="0.8"/>
  <!-- End node (gold — destination reached) -->
  <g filter="url(#gold-glow)">
    <circle cx="112" cy="34" r="10" fill="url(#arc-accent)"/>
    <circle cx="112" cy="34" r="5" fill="white"/>
  </g>

  <!-- Dashed trajectory continuation (future) -->
  <path d="M 112 34 Q 120 18 126 14" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Wordmark: arcevo -->
  <text x="154" y="95"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-size="70"
    font-weight="800"
    fill="url(#arc-text)"
    letter-spacing="-2">arcevo</text>

  <!-- Gold accent line under "arc" part -->
  <rect x="154" y="100" width="118" height="4" rx="2" fill="url(#arc-accent)" opacity="0.8"/>

  <!-- Tagline -->
  <text x="154" y="124"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-size="13.5"
    font-weight="500"
    fill="#0d9488"
    letter-spacing="4">EVOLVE · ASCEND · ARRIVE</text>
</svg>
