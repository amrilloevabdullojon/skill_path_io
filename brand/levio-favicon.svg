<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#fbbf24" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Ascending bars -->
  <rect x="10" y="44" width="9" height="10" rx="2.5" fill="white" opacity="0.4"/>
  <rect x="23" y="35" width="9" height="19" rx="2.5" fill="white" opacity="0.65"/>
  <rect x="36" y="26" width="9" height="28" rx="2.5" fill="white" opacity="0.85"/>
  <rect x="49" y="14" width="9" height="40" rx="2.5" fill="white"/>

  <!-- Gold star at top of tallest bar -->
  <g filter="url(#glow)">
    <polygon points="53.5,7 55,11.5 60,11.5 56.5,14 57.5,18.5 53.5,16 49.5,18.5 50.5,14 47,11.5 52,11.5"
      fill="#fbbf24" transform="scale(0.85) translate(7, 0)"/>
  </g>
</svg>
