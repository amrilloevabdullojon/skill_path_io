  <text x="44" y="895" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">PALETTE</text>
  <rect x="44" y="905" width="60" height="30" rx="8" fill="#0d9488"/>
  <text x="74" y="950" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#0d9488</text>
  <rect x="116" y="905" width="60" height="30" rx="8" fill="#f59e0b"/>
  <text x="146" y="950" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#f59e0b</text>
  <rect x="188" y="905" width="60" height="30" rx="8" fill="#134e4a"/>
  <text x="218" y="950" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#134e4a</text>
  <rect x="260" y="905" width="60" height="30" rx="8" fill="#fffbeb" stroke="#fef3c7" stroke-width="1"/>
  <text x="290" y="950" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#fffbeb</text>

  <!-- Arcevo description -->
  <text x="460" y="775" font-family="-apple-system, sans-serif" font-size="26" font-weight="700" fill="#134e4a">Arcevo</text>
  <text x="460" y="798" font-family="-apple-system, sans-serif" font-size="13" fill="#475569">Arc + Evolve — карьерная дуга роста</text>
  <text x="460" y="828" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">arcevo.com · arcevo.io · arcevo.app</text>
  <text x="460" y="858" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Целевая аудитория: spec. 25-40, enterprise B2B</text>
  <text x="460" y="878" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Рынки: US, UK, DACH, Nordics, GCC</text>
  <text x="460" y="908" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#0d9488">Настроение: премиальный · элегантный · зрелый</text>
  <rect x="458" y="765" width="3" height="155" rx="2" fill="#0d9488" opacity="0.3"/>

  <!-- Footer -->
  <rect x="0" y="1062" width="900" height="38" fill="#f1f5f9"/>
  <text x="36" y="1086" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">brand/  ·  traxo-logo.svg  ·  levio-logo.svg  ·  arcevo-logo.svg</text>
  <text x="720" y="1086" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">ver. 1.0</text>
</svg>
