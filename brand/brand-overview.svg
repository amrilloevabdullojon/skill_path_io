  <path d="M 130 768 Q 136 758 140 754" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.4"/>

  <text x="158" y="832" font-family="-apple-system, sans-serif" font-size="58" font-weight="800" fill="url(#a3)" letter-spacing="-2">arcevo</text>
  <rect x="158" y="836" width="118" height="3.5" rx="2" fill="url(#a2)" opacity="0.85"/>
  <text x="161" y="856" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#0d9488" letter-spacing="3.5">EVOLVE · ASCEND · ARRIVE</text>

