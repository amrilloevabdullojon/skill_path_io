<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="900" height="1100">
  <rect width="900" height="1100" fill="#f8fafc"/>

  <!-- Header -->
  <rect width="900" height="72" fill="#0f172a"/>
  <text x="36" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="white">Brand Concepts — Global Launch</text>
  <text x="720" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">2026 · SkillPath Rebranding</text>

  <!-- ─────────────────────────────────────── -->
  <!-- CONCEPT 1: TRAXO -->
  <!-- ─────────────────────────────────────── -->
  <rect x="20" y="92" width="860" height="290" rx="16" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="44" y="130" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="3">CONCEPT 01</text>

  <!-- Traxo Logo inline -->
  <defs>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="ts">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="44" y="142" width="96" height="96" rx="22" fill="url(#t1)" filter="url(#ts)"/>
  <line x1="58" y1="224" x2="98" y2="186" stroke="white" stroke-width="5.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="68" y1="232" x2="116" y2="186" stroke="white" stroke-width="7.5" stroke-linecap="round"/>
  <line x1="80" y1="236" x2="116" y2="202" stroke="white" stroke-width="5.5" stroke-linecap="round" opacity="0.5"/>
  <polygon points="116,172 128,188 104,188" fill="white"/>

  <text x="158" y="208" font-family="-apple-system, sans-serif" font-size="58" font-weight="800" fill="#0f172a" letter-spacing="-2">traxo</text>
