  <rect x="44" y="452" width="96" height="96" rx="22" fill="url(#l1)" filter="url(#ls)"/>
  <rect x="56" y="518" width="13" height="20" rx="3" fill="white" opacity="0.4"/>
  <rect x="74" y="504" width="13" height="34" rx="3" fill="white" opacity="0.6"/>
  <rect x="92" y="490" width="13" height="48" rx="3" fill="white" opacity="0.8"/>
  <rect x="110" y="472" width="13" height="66" rx="3" fill="white"/>
