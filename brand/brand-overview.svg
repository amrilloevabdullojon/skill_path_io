  <path d="M 58 844 Q 92 782 130 768" stroke="white" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="58" cy="844" r="5" fill="white" opacity="0.5"/>
  <circle cx="94" cy="802" r="5" fill="white" opacity="0.75"/>
  <g filter="url(#ag)">
