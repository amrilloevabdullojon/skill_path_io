  <text x="44" y="272" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">PALETTE</text>
  <rect x="44" y="282" width="60" height="30" rx="8" fill="#0ea5e9"/>
  <text x="74" y="327" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#0ea5e9</text>
  <rect x="116" y="282" width="60" height="30" rx="8" fill="#06b6d4"/>
  <text x="146" y="327" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#06b6d4</text>
  <rect x="188" y="282" width="60" height="30" rx="8" fill="#0f172a"/>
  <text x="218" y="327" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#0f172a</text>
