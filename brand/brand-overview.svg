  <text x="74" y="635" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#6366f1</text>
  <rect x="116" y="590" width="60" height="30" rx="8" fill="#a855f7"/>
  <text x="146" y="635" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">#a855f7</text>
