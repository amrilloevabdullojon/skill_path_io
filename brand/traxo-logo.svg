<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="traxo-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="traxo-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="traxo-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0ea5e9" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon background: rounded square -->
  <rect x="8" y="8" width="124" height="124" rx="30" fill="url(#traxo-icon)" filter="url(#traxo-shadow)"/>
  <!-- Inner glow -->
  <rect x="8" y="8" width="124" height="124" rx="30" fill="url(#traxo-glow)"/>

  <!-- Track icon: three rails converging into arrow -->
  <!-- Left rail -->
  <line x1="26" y1="96" x2="76" y2="54" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- Center rail (main) -->
  <line x1="40" y1="106" x2="100" y2="54" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <!-- Right rail -->
  <line x1="56" y1="112" x2="100" y2="72" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- Arrow head -->
  <polygon points="100,40 116,60 84,60" fill="white"/>
  <!-- Speed lines -->
  <line x1="22" y1="64" x2="38" y2="64" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="18" y1="78" x2="38" y2="78" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Wordmark: TRAXO -->
  <text x="154" y="95"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#0f172a"
    letter-spacing="-3">traxo</text>

  <!-- Accent dot on the "o" — replaced by tagline -->
  <!-- Tagline -->
  <text x="157" y="122"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
    font-size="14"
    font-weight="500"
    fill="#0ea5e9"
    letter-spacing="4">CAREER TRACKS THAT WORK</text>
</svg>
